name: Build Vasyaware Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile dylib
        run: |
          mkdir -p build
          clang++ -arch arm64 \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -mios-version-min=12.0 \
            -fobjc-arc \
            -dynamiclib \
            -framework Foundation \
            -framework UIKit \
            -framework OpenGLES \
            -framework QuartzCore \
            -framework CoreGraphics \
            -I src/ \
            -L src/ \
            -lsubstrate \
            -DGLES_SILENCE_DEPRECATION \
            -O2 \
            -o build/vasyaware.dylib \
            src/main.mm

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: vasyaware
          path: build/vasyaware.dylib
