name: Build Vasyaware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download ImGui
        run: |
          git clone --depth 1 https://github.com/ocornut/imgui.git /tmp/imgui
          cp /tmp/imgui/imgui.h src/
          cp /tmp/imgui/imconfig.h src/
          cp /tmp/imgui/imgui.cpp src/
          cp /tmp/imgui/imgui_draw.cpp src/
          cp /tmp/imgui/imgui_tables.cpp src/
          cp /tmp/imgui/imgui_widgets.cpp src/
          cp /tmp/imgui/imgui_internal.h src/
          cp /tmp/imgui/imstb_rectpack.h src/
          cp /tmp/imgui/imstb_textedit.h src/
          cp /tmp/imgui/imstb_truetype.h src/
          cp /tmp/imgui/backends/imgui_impl_opengl3.h src/
          cp /tmp/imgui/backends/imgui_impl_opengl3.cpp src/
          cp /tmp/imgui/backends/imgui_impl_opengl3_loader.h src/

      - name: Compile dylib
        run: |
          mkdir -p build
          clang++ -arch arm64 \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -mios-version-min=12.0 \
            -fobjc-arc \
            -dynamiclib \
            -framework Foundation \
            -framework UIKit \
            -framework OpenGLES \
            -framework QuartzCore \
            -framework CoreGraphics \
            -I src/ \
            -L src/ \
            -lsubstrate \
            -DGLES_SILENCE_DEPRECATION \
            -O2 \
            -o build/vasyaware.dylib \
            src/main.mm \
            src/menu.mm \
            src/imgui.cpp \
            src/imgui_draw.cpp \
            src/imgui_tables.cpp \
            src/imgui_widgets.cpp \
            src/imgui_impl_opengl3.cpp

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: vasyaware
          path: build/vasyaware.dylib
