name: Build ChickenMenu dylib

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Compile dylib
        run: |
          xcrun --sdk iphoneos clang++ \
            -arch arm64 -miphoneos-version-min=14.0 \
            -dynamiclib -std=c++17 -fobjc-arc -Wno-deprecated-declarations \
            -o ChickenMenu.dylib Tweak.mm \
            -framework UIKit -framework Foundation \
            -framework AudioToolbox -framework AVFoundation -framework QuartzCore -framework CoreGraphics \
            -lc++ \
            -install_name @executable_path/ChickenMenu.dylib
          codesign -f -s - ChickenMenu.dylib
          file ChickenMenu.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: ChickenMenu-dylib
          path: ChickenMenu.dylib
