name: Build ChickenMenu dylib

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Clone Dobby
        run: git clone --depth 1 https://github.com/jmpews/Dobby.git

      - name: Build Dobby (static, iOS arm64)
        run: |
          ls Dobby/cmake || true
          if [ -f Dobby/cmake/ios.toolchain.cmake ]; then
            echo "Using Dobby ios.toolchain.cmake"
            cmake -S Dobby -B build-dobby \
              -DCMAKE_TOOLCHAIN_FILE="$PWD/Dobby/cmake/ios.toolchain.cmake" \
              -DPLATFORM=OS64 -DARCHS=arm64 -DDEPLOYMENT_TARGET=14.0 \
              -DCMAKE_SYSTEM_PROCESSOR=arm64 \
              -DCMAKE_BUILD_TYPE=Release \
              -DDOBBY_GENERATE_SHARED=OFF
          else
            echo "Fallback: plain iOS cross build"
            cmake -S Dobby -B build-dobby \
              -DCMAKE_SYSTEM_NAME=iOS \
              -DCMAKE_SYSTEM_PROCESSOR=arm64 \
              -DCMAKE_OSX_SYSROOT=iphoneos \
              -DCMAKE_OSX_ARCHITECTURES=arm64 \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
              -DCMAKE_BUILD_TYPE=Release \
              -DDOBBY_GENERATE_SHARED=OFF
          fi
          cmake --build build-dobby --config Release -j4
          find build-dobby -name "libdobby.a" -print
          cp "$(find build-dobby -name 'libdobby.a' | head -n1)" libdobby.a

      - name: Compile dylib
        run: |
          xcrun --sdk iphoneos clang++ \
            -arch arm64 -miphoneos-version-min=14.0 \
            -dynamiclib -std=c++17 -fobjc-arc -Wno-deprecated-declarations \
            -IDobby/include \
            -o ChickenMenu.dylib Tweak.mm libdobby.a \
            -framework UIKit -framework Foundation \
            -framework AudioToolbox -framework QuartzCore \
            -lc++ \
            -install_name @executable_path/ChickenMenu.dylib
          codesign -f -s - ChickenMenu.dylib
          file ChickenMenu.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: ChickenMenu-dylib
          path: ChickenMenu.dylib
